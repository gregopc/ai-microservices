spring:
  application:
    name: product-hub

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/product_hub}
    username: ${SPRING_DATASOURCE_USERNAME:producthub}
    password: ${SPRING_DATASOURCE_PASSWORD:producthub}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework