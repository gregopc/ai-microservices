services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-product_hub}
      POSTGRES_USER: ${POSTGRES_USER:-producthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-producthub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - product-hub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-producthub} -d ${POSTGRES_DB:-product_hub}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  product-hub-postgres-data: