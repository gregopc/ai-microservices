services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-product_hub}
      POSTGRES_USER: ${POSTGRES_USER:-producthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-producthub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - product-hub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-producthub} -d ${POSTGRES_DB:-product_hub}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  product-hub:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "${PRODUCT_HUB_PORT:-8081}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-product_hub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-producthub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-producthub}
      SERVER_PORT: 8081
      EUREKA_SERVER_URL: "http://eureka-server1:8761/eureka/,http://eureka-server2:8762/eureka/"
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server1:
        condition: service_started
      eureka-server2:
        condition: service_started
      config-server:
        condition: service_started
    restart: unless-stopped

  eureka-server1:
    build:
      context: ../eureka-server
      dockerfile: dockerfile
    ports:
      - "${EUREKA_SERVER_1_PORT:-8761}:8761"
    environment:
      SERVER_PORT: 8761
      EUREKA_HOSTNAME: eureka-server1
      EUREKA_PEER_URL: http://eureka-server2:8762/eureka/
    restart: unless-stopped

  eureka-server2:
    build:
      context: ../eureka-server
      dockerfile: dockerfile
    ports:
      - "${EUREKA_SERVER_2_PORT:-8762}:8762"
    environment:
      SERVER_PORT: 8762
      EUREKA_HOSTNAME: eureka-server2
      EUREKA_PEER_URL: http://eureka-server1:8761/eureka/
    restart: unless-stopped

  config-server:
    build:
      context: ../config-server
      dockerfile: dockerfile
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"
    env_file:
      - ../config-server/.env
    environment:
      SERVER_PORT: 8888
    restart: unless-stopped

  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: dockerfile
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: "http://eureka-server1:8761/eureka/,http://eureka-server2:8762/eureka/"
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      eureka-server1:
        condition: service_started
      eureka-server2:
        condition: service_started
      config-server:
        condition: service_started
      product-hub:
        condition: service_started
    restart: unless-stopped

  ai-service:
    build:
      context: ../ai-service
      dockerfile: dockerfile
    ports:
      - "${AI_SERVICE_PORT:-8082}:8082"
    env_file:
      - ../ai-service/.env
    environment:
      SERVER_PORT: 8082
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: "http://eureka-server1:8761/eureka/,http://eureka-server2:8762/eureka/"
      SPRING_DATASOURCE_URL: jdbc:postgresql://ai-service-db:5432/ai_service
      SPRING_AI_GOOGLE_GENAI_EMBEDDING_TEXT_OPTIONS_DIMENSIONS: 768
    depends_on:
      config-server:
        condition: service_started
      eureka-server1:
        condition: service_started
      eureka-server2:
        condition: service_started
      ai-service-db:
        condition: service_healthy
    restart: unless-stopped

  ai-service-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ai_service
      POSTGRES_USER: ai_service
      POSTGRES_PASSWORD: ai_service
    volumes:
      - ai-service-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_service -d ai_service"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  product-hub-postgres-data:
  ai-service-data: